name: update-bun

on:
  schedule:
    - cron: "17 2 * * *" # 每天 02:17 UTC 检查
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bun
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check for new bun release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/update-bun.sh
          if git diff --quiet -- pkgs/bun/package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No update needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            ver="$(grep -oP 'version = "\K[^"]+' pkgs/bun/package.nix | head -n1)"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
          fi

      # 安全门：build 失败则中止，后面的 push 不会执行
      - name: Build check (x86_64-linux)
        if: steps.check.outputs.changed == 'true'
        run: nix build .#bun --no-link --print-build-logs

      - name: Commit and push to main
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/bun/package.nix
          git commit -m "bun: ${{ steps.check.outputs.version }}"
          git push
          echo "已推送 bun ${{ steps.check.outputs.version }} 到 main"
